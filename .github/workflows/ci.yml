name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: The manifests read as JSON
        run: node -e "for (const b of ['chrome', 'firefox']) JSON.parse(require('fs').readFileSync('dist/' + b + '/manifest.json'))"
